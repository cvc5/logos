name = "Cpc"
version = "0.1.0"
defaultTargets = ["Logos", "Cpc", "CpcMini"]
# Lean 4.34 defaults to all CPU cores even when LEAN_NUM_THREADS is set.
# Keep large proof modules within memory limits; this does not invalidate caches.
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Logos"
allowImportAll = true

[[lean_lib]]
name = "Cpc"
roots = []
globs = ["Cpc", "Cpc.Logos", "Cpc.LogosTerm", "Cpc.Parser", "Cpc.SmtEval", "Cpc.SmtSyntax", "Cpc.SmtTyping", "Cpc.SmtTranslate", "Cpc.TranslationChecks", "Cpc.Api", "Cpc.Native", "Cpc.Diagnostics"]
allowImportAll = true
moreLeanArgs = ["-DmaxHeartbeats=10000000", "-DwarningAsError=true"]

[[lean_lib]]
name = "CpcMini"
roots = []
globs = ["CpcMini", "CpcMini.Logos", "CpcMini.LogosTerm", "CpcMini.SmtEval", "CpcMini.SmtSyntax", "CpcMini.SmtTyping", "CpcMini.SmtTranslate", "CpcMini.TranslationChecks"]
allowImportAll = true
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "logos"
root = "Main"

[[lean_exe]]
name = "logos-native"
root = "MainNative"
supportInterpreter = true

name = "Cpc"
version = "0.1.0"
defaultTargets = ["Logos", "Cpc", "CpcMini", "SmtStd"]
# Lean 4.34 defaults to all CPU cores even when LEAN_NUM_THREADS is set.
# Keep large proof modules within memory limits; this does not invalidate caches.
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Logos"

[[lean_lib]]
name = "Cpc"
moreLeanArgs = ["-DmaxHeartbeats=10000000", "-DwarningAsError=true"]

[[lean_lib]]
name = "CpcMini"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "SmtStd"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_exe]]
name = "logos"
root = "Main"

[[lean_exe]]
name = "logos-native"
root = "MainNative"
supportInterpreter = true
